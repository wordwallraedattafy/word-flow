<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Words</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Words">
<meta name="theme-color" content="#6366f1">
<style>
:root{--bg:#f4f7ff;--card:#fff;--ink:#1d2740;--mut:#6b7794;--pri:#4f46e5;--acc:#f59e0b;--bd:#d9e0f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--card:#1c2240;--ink:#eef1ff;--mut:#9aa5c8;--bd:#2f3862}}
:root[data-theme="dark"]{--bg:#12162a;--card:#1c2240;--ink:#eef1ff;--mut:#9aa5c8;--bd:#2f3862}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 22px;font-weight:700;color:#fff;background:var(--pri)}
button:disabled{opacity:.6;cursor:default}
#setup{min-height:100%;padding:18px;max-width:1000px;margin:auto}
h1{margin:6px 0;font-size:24px}
p.h{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.auto{background:var(--acc)}.clr{background:var(--mut)}
.go{background:#16a34a;font-size:20px;padding:12px 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cell{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px}
.cell b{color:var(--mut);font-size:12px;min-width:20px}
.cell input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;direction:ltr;padding:6px 2px}
.cell span{font-size:24px;min-width:30px;text-align:center}
.foot{margin-top:18px;color:var(--mut);text-align:center}
#show{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#6366f1,#ec4899 60%,#f59e0b);color:#fff;flex-direction:column;align-items:center;justify-content:center;direction:ltr;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#card{text-align:center;perspective:900px}
#emo{font-size:min(38vw,42vh);line-height:1.1}
#word{font-size:min(16vw,15vh);font-weight:800;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.3);word-break:break-word}
.flip{animation:flip 1s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
#next{margin-top:4vh;font-size:26px;padding:16px 60px;background:#fff;color:#4f46e5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;background:rgba(255,255,255,.25);padding:8px 16px}
</style>
</head>
<body>
<div id="setup">
  <h1>📚 كلمات إنجليزية للأطفال</h1>
  <p class="h">اكتب الكلمات (كلها اختيارية) أو اضغط Auto Words لتعبئتها مع الإيموجي تلقائياً، ثم اضغط Go.</p>
  <div class="bar">
    <button class="auto" id="auto">✨ Auto Words</button>
    <button class="clr" id="clr">مسح الكل</button>
  </div>
  <div id="grid"></div>
  <div class="bar" style="justify-content:center"><button class="go" id="go">Go ▶</button></div>
  <div class="foot">👥 الآن: <b id="vNow">1</b> · 📈 زوار منذ الإنشاء: <b id="vAll">—</b> · 🔁 الزيارات: <b id="vTot">1</b></div>
</div>

<div id="show">
  <button id="back">✕</button>
  <div id="card"><div id="emo"></div><div id="word"></div></div>
  <button id="next">Next ➜</button>
</div>

<script>
const RAW="apple=🍎,banana=🍌,orange=🍊,grape=🍇,watermelon=🍉,strawberry=🍓,lemon=🍋,pineapple=🍍,cherry=🍒,carrot=🥕,tomato=🍅,potato=🥔,bread=🍞,cheese=🧀,egg=🥚,milk=🥛,pizza=🍕,burger=🍔,cake=🎂,cat=🐱,dog=🐶,lion=🦁,tiger=🐯,elephant=🐘,monkey=🐵,rabbit=🐰,horse=🐴,cow=🐮,pig=🐷,fish=🐟,bird=🐦,duck=🦆,frog=🐸,snake=🐍,turtle=🐢,bee=🐝,butterfly=🦋,spider=🕷️,dolphin=🐬,whale=🐳,shark=🦈,penguin=🐧,owl=🦉,sun=☀️,moon=🌙,star=⭐,cloud=☁️,rain=🌧️,snow=❄️,fire=🔥,tree=🌳,flower=🌸,mountain=⛰️,beach=🏖️,rainbow=🌈,earth=🌍,car=🚗,bus=🚌,train=🚂,plane=✈️,ship=🚢,bicycle=🚲,rocket=🚀,house=🏠,school=🏫,hospital=🏥,book=📚,pencil=✏️,bag=🎒,clock=⏰,phone=📱,computer=💻,camera=📷,key=🔑,umbrella=☂️,glasses=👓,shoes=👟,hat=🎩,shirt=👕,ball=⚽,music=🎵,guitar=🎸,piano=🎹,gift=🎁,balloon=🎈,heart=❤️,smile=😊,sad=😢,angry=😠,sleepy=😴,king=🤴,queen=👸,robot=🤖,ghost=👻,money=💰,light=💡,door=🚪,bed=🛏️,chair=🪑,water=💧,hand=✋,eye=👀,ear=👂,nose=👃,mouth=👄,brain=🧠,tooth=🦷,trophy=🏆,crown=👑,map=🗺️,magnet=🧲,candle=🕯️,bell=🔔,scissors=✂️,hammer=🔨,diamond=💎,volcano=🌋,island=🏝️,tent=⛺,castle=🏰,bridge=🌉,peach=🍑,pear=🍐,corn=🌽,coffee=☕,soup=🍲,cookie=🍪,candy=🍬,chocolate=🍫,popcorn=🍿,sandwich=🥪,fox=🦊,bear=🐻,panda=🐼,koala=🐨,zebra=🦓,giraffe=🦒,camel=🐪,kangaroo=🦘,parrot=🦜,eagle=🦅,crab=🦀,octopus=🐙,ant=🐜,snail=🐌,mouse=🐭,sheep=🐑,chicken=🐔,dragon=🐉,unicorn=🦄,cactus=🌵,leaf=🍃,mushroom=🍄,ocean=🌊,lightning=⚡,tornado=🌪️,helicopter=🚁,tractor=🚜,ambulance=🚑,motorcycle=🏍️,anchor=⚓,fireworks=🎆,football=🏈,basketball=🏀,tennis=🎾,drum=🥁,microphone=🎤,television=📺,telescope=🔭,microscope=🔬,battery=🔋,calendar=📅,pen=🖊️,paint=🎨,globe=🌐,flag=🚩,sword=⚔️";
const DICT={};RAW.split(",").forEach(p=>{const [w,e]=p.split("=");DICT[w]=e});
const KEYS=Object.keys(DICT);
const N=40,REPEAT=0.01;
const $=id=>document.getElementById(id);
const emojiOf=w=>{w=w.toLowerCase().trim();return DICT[w]||DICT[w.replace(/(e?s)$/,"")]||DICT[w.replace(/s$/,"")]||"📝"};

// build inputs
const grid=$("grid"),inputs=[],prevs=[];
for(let i=0;i<N;i++){
  const c=document.createElement("div");c.className="cell";
  const n=document.createElement("b");n.textContent=i+1;
  const inp=document.createElement("input");inp.type="text";inp.placeholder="word";inp.autocomplete="off";inp.spellcheck=false;
  const sp=document.createElement("span");
  inp.addEventListener("input",()=>{sp.textContent=inp.value.trim()?emojiOf(inp.value):"";save()});
  c.append(n,inp,sp);grid.appendChild(c);inputs.push(inp);prevs.push(sp);
}
function save(){try{localStorage.setItem("ew_words",JSON.stringify(inputs.map(i=>i.value)))}catch(e){}}
function refresh(){inputs.forEach((inp,i)=>prevs[i].textContent=inp.value.trim()?emojiOf(inp.value):"")}
try{const s=JSON.parse(localStorage.getItem("ew_words")||"[]");s.forEach((v,i)=>{if(inputs[i])inputs[i].value=v});refresh()}catch(e){}

// app icon for home-screen shortcut (generated PNG)
(function(){try{
const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,"#6366f1");g.addColorStop(.6,"#ec4899");g.addColorStop(1,"#f59e0b");
x.fillStyle=g;x.fillRect(0,0,512,512);
x.textAlign="center";x.textBaseline="middle";
x.font="250px serif";x.fillText("📚",256,195);
x.fillStyle="#fff";x.font="bold 130px system-ui,sans-serif";x.fillText("ABC",256,410);
const url=c.toDataURL("image/png");
const add=(rel,sz)=>{const l=document.createElement("link");l.rel=rel;l.href=url;if(sz)l.sizes=sz;document.head.appendChild(l)};
add("icon");add("apple-touch-icon","512x512");
const m={name:"English Words",short_name:"Words",display:"fullscreen",start_url:location.href,background_color:"#6366f1",theme_color:"#6366f1",icons:[{src:url,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(ml);
}catch(e){}})();

// visitors: local fallback first, then shared counters when available
let localV=0;try{localV=(parseInt(localStorage.getItem("ew_vis")||"0",10)||0)+1;localStorage.setItem("ew_vis",localV)}catch(e){}
$("vTot").textContent=localV;
(async()=>{
  if(!window.claude)return;
  try{ // visitors online now
    const room=await claude.use("room");
    if(room){const upd=()=>{$("vNow").textContent=Math.max(1,room.peers().length)};room.onPeers(upd);room.presence({on:1});upd()}
  }catch(e){}
  try{ // all-time visitors: one doc per browser, race-free
    const db=await claude.use("db");if(!db)return;
    let id;try{id=localStorage.getItem("ew_vid");if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("ew_vid",id)}}catch(e){id=Math.random().toString(36).slice(2)}
    const ref=db.doc("visitors/"+id);
    let n=0;try{const s=await ref.get();if(s.exists)n=(s.data().n)||0}catch(e){}
    await ref.set({n:n+1,last:Date.now()});
    db.collection("visitors").onSnapshot(s=>{let t=0;s.docs.forEach(d=>{t+=(d.data().n)||0});$("vAll").textContent=s.size;$("vTot").textContent=t});
  }catch(e){}
})();

// Auto Words: fill empty boxes with random kid-friendly words
const fy=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$("auto").onclick=()=>{
  const empty=inputs.filter(i=>!i.value.trim());
  if(!empty.length)return;
  const used=new Set(inputs.map(i=>i.value.trim().toLowerCase()).filter(Boolean));
  let hist=[];try{hist=JSON.parse(localStorage.getItem("ew_hist")||"[]")}catch(e){}
  // prefer words not used now and not given in recent auto-fills
  let pool=KEYS.filter(k=>!used.has(k)&&!hist.includes(k));
  if(pool.length<empty.length){hist=[];pool=KEYS.filter(k=>!used.has(k))}
  pool=fy(pool);
  empty.forEach(inp=>{if(pool.length){const w=pool.pop();inp.value=w;hist.push(w)}});
  try{localStorage.setItem("ew_hist",JSON.stringify(hist))}catch(e){}
  refresh();save();
};
$("clr").onclick=()=>{inputs.forEach(i=>i.value="");refresh();save()};

// show mode
let list=[],bag=[],seen=[],cur=null,busy=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pick(){
  if(list.length===1)return list[0];
  // 1% chance to repeat an already-shown word
  if(seen.length>1&&Math.random()<REPEAT){
    const r=seen.filter(w=>w!==cur);if(r.length)return r[Math.floor(Math.random()*r.length)];
  }
  if(!bag.length){bag=shuffle(list);if(bag[bag.length-1]===cur&&bag.length>1)bag.reverse()}
  let w=bag.pop();
  if(w===cur&&bag.length){const x=bag.pop();bag.push(w);w=x}
  return w;
}
function render(w){cur=w;if(!seen.includes(w))seen.push(w);$("word").textContent=w;$("emo").textContent=emojiOf(w)}
$("go").onclick=()=>{
  list=[...new Set(inputs.map(i=>i.value.trim()).filter(Boolean))];
  if(!list.length){alert("اكتب كلمة واحدة على الأقل أو اضغط Auto Words");return}
  bag=shuffle(list);seen=[];cur=null;
  $("setup").style.display="none";$("show").style.display="flex";
  try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}
  render(pick());
};
$("next").onclick=()=>{
  if(busy)return;busy=true;$("next").disabled=true;
  const c=$("card");c.classList.remove("flip");void c.offsetWidth;c.classList.add("flip");
  setTimeout(()=>render(pick()),500);          // change word at mid-flip
  setTimeout(()=>{c.classList.remove("flip");busy=false;$("next").disabled=false},1000);
};
$("back").onclick=()=>{
  $("show").style.display="none";$("setup").style.display="block";
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
};
</script>
</body>
</html>
